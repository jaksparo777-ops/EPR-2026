{% extends "layout/base.html" %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="glass-card" style="max-width: 500px; width: 100%; padding: 40px; text-align: center; background: rgba(17, 24, 39, 0.85); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 24px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);">
        <div style="width: 80px; height: 80px; background: rgba(239, 68, 68, 0.15); color: #f87171; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 20px auto; border: 1px solid rgba(239, 68, 68, 0.3);">
            🔒
        </div>
        <h1 style="font-size: 26px; font-weight: 800; color: #ffffff; margin: 0 0 10px 0;">403 - Permission Denied</h1>
        <p style="color: #94a3b8; font-size: 14px; margin: 0 0 28px 0; line-height: 1.6;">
            You do not have administrative access permission to view or interact with this ERP module (<strong>{{ forbidden_module|default:"Restricted Area" }}</strong>).
        </p>
        <div style="display: flex; gap: 12px; justify-content: center;">
            <a href="{% url 'dashboard' %}" class="btn-primary" style="text-decoration: none; padding: 12px 24px; font-size: 14px; font-weight: 700; border-radius: 12px; display: inline-flex; align-items: center; gap: 8px;">
                🏠 Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
